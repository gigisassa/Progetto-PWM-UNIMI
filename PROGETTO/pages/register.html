<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrazione - PGRC</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <header class="main-header">
        <nav class="navigation">
            <h1 class="logo"><a href="../index.html">PGRC</a></h1>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="register-section">
            <div class="register-container">
                <h2>Crea il tuo account</h2>
                <p>Registrati per creare e gestire il tuo ricettario personale.</p>

                <p id="form-message" class="form-message" role="alert" aria-live="polite"></p>

                <form class="register-form" id="register-form" action="#" method="post" autocomplete="on">
                    <div class="form-group">
                        <label for="username">Nome utente</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Inserisci il nome utente"
                            required
                            autocomplete="username"
                        >
                    </div>

                    <div class="form-group">
                        <label for="email">Indirizzo email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="esempio@email.it"
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Crea una password (min. 6 caratteri)"
                            required
                            minlength="6"
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">Conferma password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            placeholder="Ripeti la password"
                            required
                            autocomplete="new-password"
                        >
                    </div>

                    <div class="form-group">
                        <label for="favorite-dishes">Piatti preferiti</label>
                        <textarea
                            id="favorite-dishes"
                            name="favorite-dishes"
                            rows="4"
                            placeholder="Inserisci uno o più piatti preferiti, separati da virgola"
                            required
                        ></textarea>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="terms" required>
                            Accetto i termini di utilizzo della piattaforma
                        </label>
                    </div>

                    <button type="submit" class="btn-register">Registrati</button>
                </form>

                <div class="register-links">
                    <p>Hai già un account? <a href="login.html">Accedi</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 PGRC - Piattaforma Gestione Ricette di Cucina</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
</body>
</html>
