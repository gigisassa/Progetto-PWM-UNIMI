<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGRC - Piattaforma Gestione Ricette Cucina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <nav class="navigation">
            <h1 class="logo"><a href="index.html">PGRC</a></h1>
            <ul class="nav-menu">
                <!-- data-auth="user": solo utente collegato, data-auth="guest": solo visitatore (gestito da js/nav.js) -->
                <li data-auth="user" hidden><a href="pages/ricettario.html">Il Ricettario</a></li>
                <li><a href="pages/ricerca.html">Ricerca Avanzata</a></li>
                <li data-auth="guest"><a href="pages/login.html">Login</a></li>
                <li data-auth="user" class="nav-user" hidden>
                    <a href="pages/profilo.html" class="user-chip" title="Vai al tuo profilo">
                        <span class="user-avatar" aria-hidden="true"></span>
                        <span class="user-name"></span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    
    <main class="main-content">
        <section class="search-section">
            <h2>Cerca Ricette</h2>
            <!-- Invio con GET: il browser apre ricerca.html?search-type=name&search-query=... -->
            <form class="search-form" action="pages/ricerca.html" method="get">
                <input type="hidden" name="search-type" value="name">
                <input type="search" id="search-input" name="search-query" placeholder="Cerca una ricetta per nome..." required
                       pattern="[A-Za-zÀ-ÿ' \-]*[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ' \-]*"
                       title="Inserisci almeno una lettera; niente numeri o simboli."><br>
                <button type="submit">Cerca</button>
            </form>
        </section>
    </main>

    <footer class="main-footer">
        <p>&copy; 2026 PGRC - Piattaforma Gestione Ricette di Cucina</p>
    </footer>

    <script src="js/storage.js"></script>
    <!-- All'avvio scarica il catalogo delle ricette nel web storage (usato dalla ricerca per testo) -->
    <script src="js/catalog.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
